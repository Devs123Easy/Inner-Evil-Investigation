<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Error</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #808080;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .error-window {
            width: 420px;
            background: #f0f0f0;
            border: 1px solid #a0a0a0;
            border-radius: 4px;
            box-shadow: 0 0 0 1px #fff inset, 0 8px 30px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .title-bar {
            background: linear-gradient(180deg, #fff 0%, #e0e0e0 100%);
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            border-bottom: 1px solid #c0c0c0;
        }
        .title-text {
            font-size: 12px;
            color: #333;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .title-icon {
            width: 16px;
            height: 16px;
            background: #d32f2f;
            border-radius: 2px;
            display: inline-block;
        }
        .window-btn {
            width: 18px;
            height: 18px;
            border: 1px solid #999;
            background: linear-gradient(180deg, #fff, #e0e0e0);
            border-radius: 2px;
            font-size: 10px;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .window-btn:hover { background: #d32f2f; color: #fff; border-color: #b71c1c; }
        .content {
            padding: 24px 20px 20px 20px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }
        .error-icon {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }
        .error-icon svg { width: 100%; height: 100%; }
        .message-area {
            flex: 1;
            padding-top: 2px;
        }
        .main-msg {
            font-size: 13px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .sub-msg {
            font-size: 12px;
            color: #666;
            line-height: 1.5;
        }
        .error-code {
            font-size: 11px;
            color: #888;
            margin-top: 10px;
            font-family: 'Consolas', monospace;
            background: #e8e8e8;
            padding: 4px 8px;
            border-radius: 2px;
            display: inline-block;
        }
        .button-row {
            display: flex;
            justify-content: flex-end;
            padding: 0 20px 16px 20px;
            gap: 8px;
        }
        .btn {
            padding: 6px 22px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid;
            border-radius: 3px;
            min-width: 80px;
            text-align: center;
        }
        .btn-ok {
            background: linear-gradient(180deg, #fff, #e8e8e8);
            border-color: #999;
            color: #333;
        }
        .btn-ok:hover {
            background: linear-gradient(180deg, #f8f8f8, #ddd);
            border-color: #666;
        }
        .btn-ok:active { background: #d0d0d0; }
    </style>
</head>
<body>
    <div class="error-window">
        <div class="title-bar">
            <div class="title-text">
                <span class="title-icon"></span>
                <span data-i18n="errTitle">Setup Error</span>
            </div>
            <button class="window-btn" onclick="window.close()">&times;</button>
        </div>
        <div class="content">
            <div class="error-icon">
                <svg viewBox="0 0 48 48" fill="none">
                    <circle cx="24" cy="24" r="20" fill="#d32f2f"/>
                    <circle cx="24" cy="24" r="20" fill="url(#redGrad)"/>
                    <defs>
                        <radialGradient id="redGrad" cx="24" cy="20" r="20">
                            <stop offset="0%" stop-color="#ef5350"/>
                            <stop offset="100%" stop-color="#c62828"/>
                        </radialGradient>
                    </defs>
                    <line x1="16" y1="16" x2="32" y2="32" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
                    <line x1="32" y1="16" x2="16" y2="32" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="message-area">
                <div class="main-msg" data-i18n="mainMsg">
                    <strong>Installation failed.</strong> The setup was unable to connect to the remote server.
                </div>
                <div class="sub-msg" data-i18n="subMsg">
                    Please restart your computer and try again. If the problem persists, check your internet connection and verify that your operating system is up to date.
                </div>
                <div class="error-code" data-i18n="errCode">Error code: 0x80072F8F — ERROR_INTERNET_CANNOT_CONNECT</div>
            </div>
        </div>
        <div class="button-row">
            <button class="btn btn-ok" onclick="window.close()" data-i18n="btnOk">OK</button>
        </div>
    </div>

        function applyLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const text = translations[currentLang][key];
                if (text !== undefined) el.innerHTML = text;
            });
            document.title = translations[currentLang].title;
        }

        applyLanguage();
    </script>
</body>
</html>
